name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # The browser tests alone are ten to thirteen minutes on a runner, which
    # draws WebGL on its CPU; at fifteen for the whole job a green run was
    # once thirty seconds short of being cancelled. A test still has its own
    # minute (playwright.config.ts): this is only the backstop for a hang.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # What was actually built: the CSP, the chunks, the minified CSS.
      - name: Build output tests
        run: npm run test:dist

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # dist/ in a real browser, behind the generated response headers.
      - name: Browser tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() && failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
